[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/auth-api/*"
  to = "https://api.lendrixventech.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/nse-api/*"
  to = "https://nse.lendrixventech.com/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/bse-api/*"
  to = "https://starmfv2demo.bseindia.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/rkyc-api/*"
  to = "https://api.cra.in.kychub.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://payment.lendrixventech.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/client/*"
  to = "https://payment.lendrixventech.com/client/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/iw-api/*"
  to = "https://lendrixventech.investwell.app/api/:splat"
  status = 200
  force = true

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
